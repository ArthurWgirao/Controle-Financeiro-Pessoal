{% extends "base.html" %}


{% block conteudo %}


<h1>{{ titulo }}</h1>

{% if erro %}
<p class="mensagem-erro">{{ erro }}</p>
{% endif %}

<form method="POST" class="formulario">


<label>Descrição</label>
<input 
type="text"
name="descricao"
value="{{ receita['descricao'] if receita else '' }}"
required>


<label>Categoria</label>
<select name="categoria" required>
    <option value="">Selecione uma categoria</option>

    {% for categoria in categorias %}
    <option
    value="{{ categoria }}"
    {% if receita and receita['categoria'] == categoria %}selected{% endif %}>
        {{ categoria }}
    </option>
    {% endfor %}
</select>


<label>Valor</label>
<input
type="number"
step="0.01"
min="0.01"
name="valor"
value="{{ receita['valor'] if receita else '' }}"
required>


<button type="submit">
Salvar
</button>


</form>


{% endblock %}
