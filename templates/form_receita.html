{% extends "base.html" %}


{% block conteudo %}


<h1>{{ titulo }}</h1>

{% if erro %}
<p id="erro-formulario" class="mensagem-erro" role="alert">{{ erro }}</p>
{% endif %}

<form method="POST" class="formulario" {% if erro %}aria-describedby="erro-formulario"{% endif %}>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


<label for="descricao">Descrição</label>
<input 
id="descricao"
type="text"
name="descricao"
value="{{ receita['descricao'] if receita else '' }}"
required>


{% with dados=receita %}
{% include "_campo_categoria.html" %}
{% endwith %}


<label for="valor">Valor</label>
<input
id="valor"
type="number"
step="0.01"
min="0.01"
name="valor"
value="{{ receita['valor'] if receita else '' }}"
required>


<button type="submit">
Salvar
</button>


</form>


{% endblock %}
