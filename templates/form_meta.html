{% extends "base.html" %}

{% block conteudo %}

<h1>{{ titulo }}</h1>

{% if erro %}
<p id="erro-formulario" class="mensagem-erro" role="alert">{{ erro }}</p>
{% endif %}

<form method="POST" class="formulario" {% if erro %}aria-describedby="erro-formulario"{% endif %}>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

{% if edicao %}

<p class="rotulo-campo">Categoria</p>
<p class="campo-somente-leitura">{{ meta["categoria"] }}</p>

{% else %}

<label for="categoria">Categoria</label>
<select id="categoria" name="categoria" required>
    <option value="">Selecione uma categoria</option>

    {% for categoria in categorias %}
    <option
    value="{{ categoria }}"
    {% if meta and meta["categoria"] == categoria %}selected{% endif %}>
        {{ categoria }}
    </option>
    {% endfor %}
</select>

{% endif %}

<label for="limite">Limite mensal</label>
<input
id="limite"
type="number"
step="0.01"
min="0.01"
name="limite"
value="{{ meta['limite'] if meta else '' }}"
required>

<button type="submit">
Salvar
</button>

</form>

{% endblock %}
