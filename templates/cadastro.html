{% extends "base.html" %}
{% block conteudo %}
<section class="auth-card">
    <h1>Criar conta</h1>
    {% if erro %}<div class="mensagem-erro" role="alert">{{ erro }}</div>{% endif %}
    <form method="POST" class="formulario auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" autocomplete="name" required maxlength="120" value="{{ nome }}">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" value="{{ email }}">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
        <label for="confirmacao_senha">Confirme a senha</label>
        <input id="confirmacao_senha" name="confirmacao_senha" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
        <button type="submit">Criar conta</button>
    </form>
    <p>Já possui conta? <a href="{{ url_for('login') }}">Entre aqui</a>.</p>
</section>
{% endblock %}
