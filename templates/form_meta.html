{% extends "base.html" %}

{% block conteudo %}

<h1>{{ titulo }}</h1>

{% if erro %}
<p class="mensagem-erro">{{ erro }}</p>
{% endif %}

<form method="POST" class="formulario">

{% if edicao %}

<label>Categoria</label>
<p class="campo-somente-leitura">{{ meta["categoria"] }}</p>

{% else %}

<label>Categoria</label>
<select name="categoria" required>
    <option value="">Selecione uma categoria</option>

    {% for categoria in categorias %}
    <option
    value="{{ categoria }}"
    {% if meta and meta["categoria"] == categoria %}selected{% endif %}>
        {{ categoria }}
    </option>
    {% endfor %}
</select>

{% endif %}

<label>Limite mensal</label>
<input
type="number"
step="0.01"
min="0.01"
name="limite"
value="{{ meta['limite'] if meta else '' }}"
required>

<button type="submit">
Salvar
</button>

</form>

{% endblock %}
